<!doctype html>
<html lang="fr" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes" />
    <meta name="theme-color" content="#065f46" />
    <meta name="description" content="Les Enfants d'Adam - Plateforme guinéenne d'enregistrement généalogique, santé, éducation et solidarité." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="only light" />
    <!-- Samsung Internet assombrit lui-même les sites (mode sombre du téléphone),
         sauf ceux qui déclarent gérer le sombre (« light dark »). On le déclare pour
         lui seul ; le contenu reste dessiné en clair (body : only light, index.css).
         Chrome garde « only light », qu'il respecte. -->
    <script>
      if (/SamsungBrowser/i.test(navigator.userAgent)) {
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', 'light dark');
        document.documentElement.classList.add('samsung-internet');
      }
    </script>
    <meta name="robots" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo-moftal.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-moftal-192.png?v=2" />
    <link rel="apple-touch-icon" href="/icon-moftal-512.png?v=2" id="apple-icon" />

    <!-- PWA manifest — choisi immédiatement selon la route, avant que React charge.
         Doit rester un <script> synchrone dans le <head> (pas dans main.tsx, chargé en
         module différé) : sinon le navigateur a déjà évalué l'installabilité avec le
         manifest par défaut "Moftal" avant que la réécriture n'ait lieu, et c'est
         l'app principale qui s'installe au lieu de l'espace de gestion du pro. -->
    <link rel="manifest" href="/manifest.webmanifest" id="pwa-manifest" />
    <script>
      (function(){
        try {
          var p = window.location.pathname;
          var link = document.getElementById('pwa-manifest');
          var origin = encodeURIComponent(window.location.origin);
          var proMatch = p.match(/^\/espace-pro\/([^/]+)/);
          var gestionMatch = p.match(/^(\/gestion-[^/]+\/([^/]+))/);
          if (p.startsWith('/info-wallou')) {
            link.href = '/manifest-info-moftal.webmanifest';
          } else if (p.startsWith('/professeur-ia')) {
            link.href = '/manifest-ia-education-moftal.webmanifest';
          } else if (proMatch) {
            link.href = '/api/professionals/pro-manifest/' + proMatch[1] + '?origin=' + origin;
          } else if (gestionMatch) {
            // Racine de la gestion seulement : une seule identité d'application par établissement
            link.href = '/api/professionals/pro-manifest/by-tenant/' + gestionMatch[2] + '?startUrl=' + encodeURIComponent(gestionMatch[1]) + '&origin=' + origin;
            // iPhone : l'icône de l'écran d'accueil est le logo de l'établissement, pas celui de Moftal
            var appleIcon = document.getElementById('apple-icon');
            if (appleIcon) appleIcon.href = '/api/professionals/tenant-icon-png/' + gestionMatch[2];
          }
        } catch(e) {}
      })();
    </script>

    <!-- Preload LCP -->
    <link rel="preload" as="image" href="/logo-moftal.svg" type="image/svg+xml" fetchpriority="high" />

    <!-- Preconnect backend : connexion TCP établie avant la 1ère requête API -->
    <link rel="preconnect" href="https://enfants-adam-backend.onrender.com" crossorigin />
    <!-- Écritures N'Ko (mandinka) et Adlam (pular) : sans ces polices, beaucoup de
         téléphones et d'ordinateurs affichent des carrés. Le navigateur ne télécharge
         la police que si la page contient vraiment ces lettres (unicode-range). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Adlam:wght@400;700&family=Noto+Sans+NKo&display=swap" />
    <link rel="dns-prefetch" href="https://enfants-adam-backend.onrender.com" />

    <!-- Forcer le mode clair toujours -->
    <script>
      (function(){try{document.documentElement.classList.remove('dark');document.documentElement.classList.add('light');localStorage.setItem('theme','light');}catch(e){}})();
    </script>

    <title>Moftal</title>
    <!-- Suivi des erreurs : chargé sans bloquer l'affichage (réseau lent ou coupé = le site s'affiche quand même) -->
    <script async src="https://cdn.logr-in.com/LogRocket.min.js" crossorigin="anonymous" onload="window.LogRocket && window.LogRocket.init('0vmbcf/moftal')"></script>
  </head>
  <body style="background-color:#ffffff;color-scheme:only light;">
    <div id="root" style="background-color:#ffffff;"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Jamais de page blanche : si le site n'a pas démarré (navigateur trop ancien,
         ancienne copie du site gardée sur le téléphone, connexion coupée), on le dit
         et on propose de recharger proprement. Écrit en ancien JavaScript exprès :
         il doit marcher là où le site lui-même ne marche pas. -->
    <div id="secours-demarrage" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:2147483647;overflow:auto;background:#ffffff;font-family:system-ui,sans-serif;padding:48px 20px;text-align:center;color:#0f172a">
      <img src="/logo-moftal.svg" alt="Moftal" width="72" height="72" style="display:block;margin:0 auto 16px" />
      <h1 style="font-size:20px;margin:0 0 10px">Le site n'a pas pu s'afficher</h1>
      <p style="font-size:15px;color:#475569;line-height:1.5;margin:0 auto 20px;max-width:420px">Touchez « Recharger ». Si la page reste blanche, mettez à jour votre navigateur internet depuis la boutique d'applications du téléphone, puis réessayez.</p>
      <button id="secours-recharger" type="button" style="background:#065f46;color:#fff;border:none;border-radius:12px;padding:14px 28px;font-size:16px;font-weight:700">Recharger</button>
    </div>
    <script>
      (function () {
        var vu = false;
        function montrer() {
          var racine = document.getElementById('root');
          if (vu || (racine && racine.children.length)) return;
          vu = true;
          var bloc = document.getElementById('secours-demarrage');
          if (!bloc) return;
          bloc.style.display = 'block';
          // Le site finit par démarrer (connexion lente) : le message s'efface
          var suivi = setInterval(function () {
            if (racine && racine.children.length) { bloc.style.display = 'none'; clearInterval(suivi); }
          }, 1000);
        }
        // Code du site illisible pour ce navigateur : message tout de suite
        window.addEventListener('error', function (e) {
          if (e && e.error && e.error.name === 'SyntaxError') montrer();
        });
        setTimeout(montrer, 12000);
        var bouton = document.getElementById('secours-recharger');
        if (bouton) bouton.onclick = function () {
          bouton.disabled = true; bouton.textContent = 'Rechargement…';
          var fin = function () { location.reload(); };
          try {
            var etapes = [];
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              etapes.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }));
            }
            if (window.caches && caches.keys) {
              etapes.push(caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }));
            }
            Promise.all(etapes).then(fin, fin);
            setTimeout(fin, 4000);
          } catch (e) { fin(); }
        };
      })();
    </script>
  </body>
</html>
