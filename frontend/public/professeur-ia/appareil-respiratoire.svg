<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" font-family="Arial, sans-serif">
  <rect width="480" height="400" fill="#ffffff"/>
  <text x="240" y="22" font-size="16" font-weight="bold" fill="#1e3a8a" text-anchor="middle">L'appareil respiratoire</text>

  <!-- Silhouette légère -->
  <circle cx="150" cy="45" r="26" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <path d="M 90 75 Q 90 70 110 68 L 190 68 Q 210 70 210 75 L 218 340 Q 218 355 203 355 L 97 355 Q 82 355 82 340 Z"
        fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>

  <!-- Nez / bouche -->
  <ellipse cx="150" cy="68" rx="7" ry="3" fill="#1e3a8a"/>
  <!-- Trachée -->
  <rect x="144" y="72" width="12" height="55" rx="5" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2.5"/>
  <!-- Bronches -->
  <path d="M 150 127 L 120 155 M 150 127 L 180 155" fill="none" stroke="#1d4ed8" stroke-width="7" stroke-linecap="round"/>
  <!-- Poumon gauche -->
  <path d="M 120 155 Q 80 165 78 220 Q 76 275 110 290 Q 135 298 138 260 L 138 165 Z"
        fill="#93c5fd" stroke="#1d4ed8" stroke-width="2.5"/>
  <!-- Poumon droit -->
  <path d="M 180 155 Q 220 165 222 220 Q 224 275 190 290 Q 165 298 162 260 L 162 165 Z"
        fill="#93c5fd" stroke="#1d4ed8" stroke-width="2.5"/>
  <!-- Alvéoles (petits ronds dans les poumons) -->
  <g fill="#dbeafe" stroke="#1d4ed8" stroke-width="1">
    <circle cx="105" cy="200" r="7"/><circle cx="120" cy="220" r="7"/><circle cx="105" cy="240" r="7"/><circle cx="120" cy="260" r="7"/>
    <circle cx="195" cy="200" r="7"/><circle cx="180" cy="220" r="7"/><circle cx="195" cy="240" r="7"/><circle cx="180" cy="260" r="7"/>
  </g>
  <!-- Diaphragme -->
  <path d="M 90 300 Q 150 320 210 300" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>

  <!-- Lignes de rappel + étiquettes directes -->
  <g stroke="#64748b" stroke-width="1.3" fill="none">
    <path d="M 150 90 L 270 75 L 330 75"/>
    <path d="M 100 220 L 270 145 L 330 145"/>
    <path d="M 195 240 L 270 210 L 330 210"/>
    <path d="M 150 312 L 270 280 L 330 280"/>
  </g>
  <g>
    <circle cx="150" cy="90" r="3.5" fill="#1d4ed8"/>
    <circle cx="100" cy="220" r="3.5" fill="#1d4ed8"/>
    <circle cx="195" cy="240" r="3.5" fill="#1d4ed8"/>
    <circle cx="150" cy="312" r="3.5" fill="#f59e0b"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#0f172a">
    <text x="335" y="80">Trachée</text>
    <text x="335" y="150">Poumons</text>
    <text x="335" y="215">Alvéoles</text>
    <text x="335" y="285">Diaphragme</text>
  </g>
</svg>
