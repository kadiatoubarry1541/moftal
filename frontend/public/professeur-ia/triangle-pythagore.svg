<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" font-family="Arial, sans-serif">
  <rect width="400" height="300" fill="#ffffff"/>
  <!-- Triangle rectangle : sommets A(60,240) B(60,60) C(320,240) -->
  <polygon points="60,240 60,60 320,240" fill="#eff6ff" stroke="#1d4ed8" stroke-width="3" stroke-linejoin="round"/>
  <!-- Angle droit en B -->
  <rect x="60" y="222" width="18" height="18" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
  <!-- Sommets -->
  <circle cx="60" cy="240" r="3.5" fill="#1d4ed8"/>
  <circle cx="60" cy="60" r="3.5" fill="#1d4ed8"/>
  <circle cx="320" cy="240" r="3.5" fill="#1d4ed8"/>
  <text x="38" y="256" font-size="18" font-weight="bold" fill="#1e3a8a">A</text>
  <text x="38" y="56" font-size="18" font-weight="bold" fill="#1e3a8a">B</text>
  <text x="330" y="256" font-size="18" font-weight="bold" fill="#1e3a8a">C</text>
  <!-- Côté AB = b (vertical, opposé) -->
  <text x="28" y="155" font-size="20" font-weight="bold" fill="#dc2626">b</text>
  <!-- Côté BC = a (horizontal) -->
  <text x="185" y="228" font-size="20" font-weight="bold" fill="#dc2626">a</text>
  <!-- Hypoténuse AC = c -->
  <text x="190" y="140" font-size="20" font-weight="bold" fill="#059669" transform="rotate(28 190 140)">c (hypoténuse)</text>
  <!-- Formule -->
  <text x="120" y="285" font-size="22" font-weight="bold" fill="#0f172a">a² + b² = c²</text>
</svg>
