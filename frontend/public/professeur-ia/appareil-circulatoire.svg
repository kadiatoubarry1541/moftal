<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" font-family="Arial, sans-serif">
  <rect width="480" height="420" fill="#ffffff"/>
  <text x="240" y="22" font-size="16" font-weight="bold" fill="#991b1b" text-anchor="middle">L'appareil circulatoire</text>

  <!-- Silhouette légère -->
  <circle cx="150" cy="45" r="26" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <path d="M 90 75 Q 90 70 110 68 L 190 68 Q 210 70 210 75 L 222 360 Q 222 375 207 375 L 93 375 Q 78 375 78 360 Z"
        fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>

  <!-- Veines (bleu) partant des membres vers le coeur -->
  <path d="M 20 200 Q 60 190 100 170 M 20 340 Q 60 320 105 260" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <!-- Artères (rouge) partant du coeur vers les membres -->
  <path d="M 280 200 Q 240 190 200 170 M 280 340 Q 240 320 195 260" fill="none" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>

  <!-- Coeur -->
  <path d="M 150 210 C 110 175, 60 195, 70 235 C 78 268, 120 290, 150 320 C 180 290, 222 268, 230 235 C 240 195, 190 175, 150 210 Z"
        fill="#ef4444" stroke="#991b1b" stroke-width="3"/>
  <!-- 4 cavités (illustration simplifiée) -->
  <line x1="150" y1="205" x2="150" y2="310" stroke="#991b1b" stroke-width="2.5"/>
  <line x1="100" y1="235" x2="200" y2="235" stroke="#991b1b" stroke-width="2.5"/>
  <text x="120" y="228" font-size="12" fill="#fff" font-weight="bold">OG</text>
  <text x="170" y="228" font-size="12" fill="#fff" font-weight="bold">OD</text>
  <text x="118" y="270" font-size="12" fill="#fff" font-weight="bold">VG</text>
  <text x="168" y="270" font-size="12" fill="#fff" font-weight="bold">VD</text>

  <!-- Globules (petits ronds) dans un vaisseau -->
  <circle cx="50" cy="195" r="5" fill="#dc2626"/>
  <circle cx="65" cy="185" r="5" fill="#dc2626"/>
  <circle cx="250" cy="195" r="5" fill="#2563eb"/>

  <!-- Lignes de rappel + étiquettes directes -->
  <g stroke="#64748b" stroke-width="1.3" fill="none">
    <path d="M 150 215 L 270 95 L 330 95"/>
    <path d="M 150 300 L 270 155 L 330 155"/>
    <path d="M 220 180 L 270 215 L 330 215"/>
    <path d="M 60 180 L 270 265 L 330 265"/>
  </g>
  <g>
    <circle cx="150" cy="215" r="3.5" fill="#991b1b"/>
    <circle cx="150" cy="300" r="3.5" fill="#991b1b"/>
    <circle cx="220" cy="180" r="3.5" fill="#dc2626"/>
    <circle cx="60" cy="180" r="3.5" fill="#2563eb"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#0f172a">
    <text x="335" y="92">Oreillettes</text>
    <text x="335" y="152">Ventricules</text>
    <text x="335" y="220">Artère</text>
    <text x="335" y="270">Veine</text>
  </g>
  <g font-size="12" fill="#475569">
    <text x="335" y="108">(haut du cœur)</text>
    <text x="335" y="168">(bas du cœur)</text>
    <text x="335" y="236">sang riche en O₂</text>
    <text x="335" y="286">retour vers le cœur</text>
  </g>
</svg>
