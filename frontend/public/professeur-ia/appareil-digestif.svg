<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 460" font-family="Arial, sans-serif">
  <rect width="380" height="460" fill="#ffffff"/>
  <!-- Silhouette légère pour situer les organes -->
  <circle cx="190" cy="35" r="26" fill="#fef3f2" stroke="#fca5a5" stroke-width="2"/>
  <path d="M 130 65 Q 130 60 150 58 L 230 58 Q 250 60 250 65 L 260 410 Q 260 425 245 425 L 135 425 Q 120 425 120 410 Z"
        fill="#fef3f2" stroke="#fca5a5" stroke-width="2"/>

  <!-- Bouche -->
  <ellipse cx="190" cy="58" rx="8" ry="3" fill="#7c2d12"/>
  <!-- Œsophage -->
  <rect x="185" y="62" width="10" height="55" rx="4" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
  <!-- Estomac -->
  <path d="M 175 115 Q 150 120 148 155 Q 146 190 185 195 Q 215 195 218 165 Q 220 130 195 118 Z"
        fill="#fdba74" stroke="#c2410c" stroke-width="2.5"/>
  <!-- Foie (à côté de l'estomac) -->
  <path d="M 218 120 Q 250 118 255 140 Q 258 160 235 165 Q 215 162 215 145 Z"
        fill="#f9a8d4" stroke="#be185d" stroke-width="2"/>
  <!-- Intestin grêle (spirale simplifiée) -->
  <path d="M 185 195 C 150 205, 150 225, 185 230 C 220 235, 220 255, 185 260 C 150 265, 150 285, 185 290 C 215 293, 218 310, 195 315"
        fill="none" stroke="#fb923c" stroke-width="9" stroke-linecap="round"/>
  <!-- Gros intestin (cadre autour) -->
  <path d="M 138 200 L 138 340 Q 138 355 155 355 L 225 355 Q 242 355 242 340 L 242 205"
        fill="none" stroke="#65a30d" stroke-width="12" stroke-linecap="round"/>
  <!-- Rectum -->
  <rect x="183" y="355" width="12" height="30" rx="4" fill="#84cc16" stroke="#4d7c0f" stroke-width="2"/>

  <!-- Légende -->
  <g font-size="14">
    <circle cx="30" cy="410" r="6" fill="#fca5a5"/><text x="42" y="415" fill="#0f172a">Œsophage</text>
    <circle cx="30" cy="430" r="6" fill="#fdba74"/><text x="42" y="435" fill="#0f172a">Estomac</text>
    <circle cx="150" cy="410" r="6" fill="#f9a8d4"/><text x="162" y="415" fill="#0f172a">Foie</text>
    <circle cx="150" cy="430" r="6" fill="#fb923c"/><text x="162" y="435" fill="#0f172a">Intestin grêle</text>
    <circle cx="270" cy="410" r="6" fill="#65a30d"/><text x="282" y="415" fill="#0f172a">Gros intestin</text>
  </g>
  <text x="190" y="20" font-size="16" font-weight="bold" fill="#7c2d12" text-anchor="middle">L'appareil digestif</text>
</svg>
