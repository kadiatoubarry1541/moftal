<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" font-family="Arial, sans-serif">
  <rect width="520" height="440" fill="#ffffff"/>
  <text x="260" y="24" font-size="17" font-weight="bold" fill="#7c2d12" text-anchor="middle">L'appareil digestif</text>

  <!-- Silhouette légère pour situer les organes -->
  <circle cx="150" cy="45" r="26" fill="#fef3f2" stroke="#fca5a5" stroke-width="2"/>
  <path d="M 90 75 Q 90 70 110 68 L 190 68 Q 210 70 210 75 L 220 400 Q 220 415 205 415 L 95 415 Q 80 415 80 400 Z"
        fill="#fef3f2" stroke="#fca5a5" stroke-width="2"/>

  <!-- Bouche -->
  <ellipse cx="150" cy="68" rx="8" ry="3" fill="#7c2d12"/>
  <!-- Œsophage -->
  <rect x="145" y="72" width="10" height="55" rx="4" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
  <!-- Estomac -->
  <path d="M 135 125 Q 110 130 108 165 Q 106 200 145 205 Q 175 205 178 175 Q 180 140 155 128 Z"
        fill="#fdba74" stroke="#c2410c" stroke-width="2.5"/>
  <!-- Foie (à côté de l'estomac) -->
  <path d="M 178 130 Q 210 128 215 150 Q 218 170 195 175 Q 175 172 175 155 Z"
        fill="#f9a8d4" stroke="#be185d" stroke-width="2"/>
  <!-- Intestin grêle (spirale simplifiée) -->
  <path d="M 145 205 C 110 215, 110 235, 145 240 C 180 245, 180 265, 145 270 C 110 275, 110 295, 145 300 C 175 303, 178 320, 155 325"
        fill="none" stroke="#fb923c" stroke-width="9" stroke-linecap="round"/>
  <!-- Gros intestin (cadre autour) -->
  <path d="M 98 210 L 98 350 Q 98 365 115 365 L 185 365 Q 202 365 202 350 L 202 215"
        fill="none" stroke="#65a30d" stroke-width="12" stroke-linecap="round"/>
  <!-- Rectum -->
  <rect x="143" y="365" width="12" height="30" rx="4" fill="#84cc16" stroke="#4d7c0f" stroke-width="2"/>

  <!-- Lignes de rappel + étiquettes directes -->
  <g stroke="#64748b" stroke-width="1.3" fill="none">
    <path d="M 150 90 L 260 78 L 330 78"/>
    <path d="M 150 155 L 260 145 L 330 145"/>
    <path d="M 195 150 L 260 190 L 330 190"/>
    <path d="M 145 250 L 260 235 L 330 235"/>
    <path d="M 202 270 L 260 280 L 330 280"/>
    <path d="M 149 380 L 260 325 L 330 325"/>
  </g>
  <g stroke="#0f172a" stroke-width="0">
    <circle cx="150" cy="90" r="3.5" fill="#b91c1c"/>
    <circle cx="150" cy="155" r="3.5" fill="#c2410c"/>
    <circle cx="195" cy="150" r="3.5" fill="#be185d"/>
    <circle cx="145" cy="250" r="3.5" fill="#ea580c"/>
    <circle cx="202" cy="270" r="3.5" fill="#4d7c0f"/>
    <circle cx="149" cy="380" r="3.5" fill="#4d7c0f"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#0f172a">
    <text x="335" y="83">Œsophage</text>
    <text x="335" y="150">Estomac</text>
    <text x="335" y="195">Foie</text>
    <text x="335" y="240">Intestin grêle</text>
    <text x="335" y="285">Gros intestin</text>
    <text x="335" y="330">Rectum</text>
  </g>
</svg>
