name: Keep backend alive

# Ping le serveur backend toutes les 10 minutes pour l'empêcher de se mettre
# en veille (plan gratuit Render : le serveur s'endort après 15 minutes sans
# visiteur, et met 30-60s à redémarrer au prochain visiteur — d'où les
# erreurs "Serveur momentanément indisponible").
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: curl -sS --max-time 30 https://api.moftal.com/api/health || true
