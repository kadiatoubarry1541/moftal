name: Keep backend alive

# Ping /api/health toutes les 4 minutes. Ce endpoint interroge maintenant
# aussi la base de données (voir server.js) — nécessaire car la base Neon
# (plan gratuit) suspend son compute après ~5 minutes d'inactivité, même
# si le serveur web Render (plan Starter) ne s'endort plus lui-même.
on:
  schedule:
    - cron: '*/4 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: curl -sS --max-time 30 https://api.moftal.com/api/health || true
