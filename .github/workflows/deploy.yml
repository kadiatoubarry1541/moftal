name: Vérifier puis mettre en ligne

# 1. « verifier » contrôle le serveur et le site à chaque envoi de code
#    (toutes les branches et les demandes de fusion).
# 2. « deploy » ne met le site en ligne que depuis main, et SEULEMENT
#    si toutes les vérifications ont réussi.

on:
  push:
  pull_request:

# Un nouvel envoi annule la vérification encore en cours sur la même branche.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  serveur:
    name: Serveur — tests avec une base de test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moftal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances du serveur
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Lancer les tests du serveur
        working-directory: backend
        run: npm test
        env:
          TEST_DB: '1'
          DB_HOST: localhost
          DB_PORT: '5432'
          DB_NAME: moftal_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: secret-de-test-uniquement

  site:
    name: Site — qualité du code et construction
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances du site
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Vérifier le code (lint)
        working-directory: frontend
        run: npm run lint

      - name: Vérifier les types
        working-directory: frontend
        run: npm run typecheck

      - name: Construire le site
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.moftal.com
          VITE_PAYMENTS_ENABLED: 'true'

      - name: Garder le site construit pour la mise en ligne
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site-construit
          path: frontend/dist
          retention-days: 3

  deploy:
    name: Mise en ligne (Cloudflare)
    needs: [serveur, site]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Une mise en ligne n'est jamais annulée au milieu par un envoi suivant.
    concurrency:
      group: mise-en-ligne-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # On met en ligne exactement le site qui vient d'être vérifié.
      - name: Récupérer le site construit
        uses: actions/download-artifact@v4
        with:
          name: site-construit
          path: frontend/dist

      - name: Mettre en ligne sur Cloudflare Workers
        working-directory: frontend
        run: npx wrangler@3 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
