# Analyse de sécurité du code (CodeQL, gratuite pour un dépôt public) :
# signale dans l'onglet « Security » les failles courantes (injections, XSS…).
name: Analyse de sécurité du code
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          paths-ignore: |
            **/node_modules
            **/dist
      - uses: github/codeql-action/analyze@v3
